[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gnl-process"
version = "2.0.0"
description = "NotebookLM Podcast Pipeline"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "fastapi==0.118.0",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "websockets>=12.0",
    "apscheduler>=3.10",
    "markdown>=3.5",
    "notebooklm-mcp-cli>=0.8.1",
    "PyPDF2>=3.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "weasyprint>=60.0",
    "genanki>=0.13",
    "python-docx>=1.0",
]

[project.scripts]
gnl = "gnl_core.cli:cli"

[tool.setuptools.packages.find]
include = ["gnl_core*"]
